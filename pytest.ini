[pytest]
testpaths = tests
addopts = -m "not real_readonly" -q
markers =
    real_readonly: lê SOMENTE os nomes dos arquivos do DOWNLOADS_DIR real, sem abrir, mover ou escrever nada. Desligado por padrão.
    lento: testes de desempenho com volume grande de dados.
filterwarnings =
    ignore::DeprecationWarning
